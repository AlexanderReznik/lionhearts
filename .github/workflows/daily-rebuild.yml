name: Daily rebuild

on:
  schedule:
    - cron: '0 1 * * *'  # Every day at 01:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel redeploy
        run: curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
